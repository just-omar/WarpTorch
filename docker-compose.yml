services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - TORCH_VERSION=${TORCH_VERSION:-cpu}
    container_name: warptorch-backend
    ports:
      - "${BACKEND_PORT:-8099}:8099"
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_PORT=8099
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-3005},http://frontend:${FRONTEND_PORT:-3005}}
    volumes:
      # Mount core and backend directories for hot reload development
      - ./core:/app/core
      - ./backend:/app/backend
      - ./output:/app/output
      # Persist database and simulation data
      - ./simulations.db:/app/simulations.db
      - ./simulation_data:/app/simulation_data
    networks:
      - warptorch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8099/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - FRONTEND_PORT=${FRONTEND_PORT:-3005}
        - BACKEND_PORT=${BACKEND_PORT:-8099}
    container_name: warptorch-frontend
    ports:
      - "${FRONTEND_PORT:-3005}:3005"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Mount frontend directory for hot reload development
      # Use anonymous volume for node_modules to avoid conflicts
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    networks:
      - warptorch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  docs:
    build:
      context: ./documentation
      dockerfile: Dockerfile
    container_name: warptorch-docs
    ports:
      - "${DOCS_PORT:-3553}:3553"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      # Mount documentation directory for hot reload development
      - ./documentation:/app
      - /app/node_modules
    networks:
      - warptorch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3553/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  jupyter:
    build:
      context: .
      dockerfile: jupyter/Dockerfile
      args:
        - TORCH_VERSION=${TORCH_VERSION:-cpu}
    container_name: warptorch-jupyter
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      # Mount Jupyter notebooks directory with explicit name
      - ./jupyter_notebooks:/home/jovyan/jupyter_notebooks
      # Access simulation data for analysis
      - ./simulation_data:/home/jovyan/simulation_data
      - ./output:/home/jovyan/output
      # Access database for results analysis
      - ./simulations.db:/home/jovyan/simulations.db
      # Full access to core and backend code for development
      - ./core:/home/jovyan/core
      - ./backend:/home/jovyan/backend
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-warptorch}
      - JUPYTER_ENABLE_LAB=yes
    networks:
      - warptorch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  warptorch-network:
    driver: bridge

volumes:
  output-data:
    driver: local
