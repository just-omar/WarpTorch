services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - TORCH_VERSION=${TORCH_VERSION:-cpu}
    container_name: warptorch-backend
    ports:
      - "${BACKEND_PORT:-8099}:8099"
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_PORT=8099
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-3005},http://frontend:${FRONTEND_PORT:-3005}}
    volumes:
      # Mount core directory for development (comment out for production)
      - ./core:/app/core:ro
      - ./output:/app/output
    networks:
      - warptorch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8099/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - FRONTEND_PORT=${FRONTEND_PORT:-3005}
        - BACKEND_PORT=${BACKEND_PORT:-8099}
    container_name: warptorch-frontend
    ports:
      - "${FRONTEND_PORT:-3005}:3005"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - warptorch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  docs:
    build:
      context: ./documentation
      dockerfile: Dockerfile
    container_name: warptorch-docs
    ports:
      - "${DOCS_PORT:-3553}:3553"
    networks:
      - warptorch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3553/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  warptorch-network:
    driver: bridge

volumes:
  output-data:
    driver: local
